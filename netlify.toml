[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev -- --host 127.0.0.1 --port 5173 --strictPort"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/callback"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/my-movies"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/recommendations"
  to = "/index.html"
  status = 200
